# This workflow will, once the tests have passed on main:
# 1) Determine the next version from the commit history (conventional commits)
# 2) Create a git tag (setuptools-scm derives the package version from it)
# 3) Upload the package to PyPI using trusted publishing
# 4) Create a release on GitHub
#
# Trusted publishing must be configured on PyPI:
# https://blog.pypi.org/posts/2023-04-20-introducing-trusted-publishers/

name: release

on:
  workflow_run:
    workflows: ["tests"]
    branches: [main]
    types:
      - completed

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      id-token: write # mandatory for trusted publishing to PyPI
      contents: write # push the tag and create the GitHub release

    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Leaves the working tree untouched, so PSR finds nothing to commit and
          # only tags HEAD. Release notes are still generated for the GitHub Release.
          changelog: false

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.release.outputs.released == 'true'

      - name: Publish package distributions to GitHub Releases
        uses: python-semantic-release/publish-action@v10.7.0
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
