name: static_type_checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  static_type_checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"

      - name: Run static type checker
        run: make static-type-check
