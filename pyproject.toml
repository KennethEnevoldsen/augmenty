[build-system]
requires = ["setuptools>=77.0.0", "setuptools-scm>=8.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "augmenty"
# Derived from the latest git tag by setuptools-scm
dynamic = ["version"]
description = "An augmentation library based on SpaCy for joint augmentation of text and labels."
authors = [
    { name = "Kenneth Enevoldsen", email = "kennethcenevoldsen@gmail.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = [
    "nlp",
    "NLP",
    "spaCy",
    "text analysis",
    "natural language processing",
    "text mining",
    "augmentation",
    "data augmentation",
    "data science",
    "machine learning",
    "deep learning",
]
requires-python = ">=3.10"
dependencies = [
    "spacy>=3.2.0",
    "catalogue>=2.0.4",
    "thinc>=8.0.8",
    "pydantic>=1.8.2",
    "numpy>=1.15.0",
]
license = "MIT"
license-files = ["LICENSE"]

[project.readme]
file = "readme.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/KennethEnevoldsen/augmenty"
Documentation = "https://kennethenevoldsen.github.io/augmenty/"
Repository = "https://github.com/KennethEnevoldsen/augmenty"

[project.optional-dependencies]
da = ["dacy>=2.3.1"]
all = ["nltk>=3.10.0"]

[dependency-groups]
dev = [
    "ruff==0.17.6",
    "ty>=0.0.109",
]
tests = [
    "pytest>=7.1.3,<8.0.0",       # due to https://github.com/TvoroG/pytest-lazy-fixture/issues/65
    "pytest-cov>=3.0.0",
    "pytest-lazy-fixture>=0.6.3",
    "pytest-timeout>=2.1.0",
    "dacy>=2.3.1",                # DaNE test set
    "nltk>=3.10.0",                # wordnet augmenters
    "en-core-web-md",
]
docs = [
    "sphinx>=7.0.0",
    "furo>=2024.1.29",             # theme
    "sphinx-copybutton>=0.5.1",
    "sphinxext-opengraph>=0.7.3",
    "sphinx_design>=0.3.0",
    "myst-nb>=1.0.0",              # for rendering notebooks
    # for tutorials
    "jupyter>=1.0.0",
    "faker>=13.13.0",
    "nltk>=3.10.0",
    "en-core-web-lg",
]

[tool.uv]
default-groups = ["dev", "tests"]

[tool.uv.sources]
# spaCy models are not on PyPI; pin them to the GitHub release wheels.
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-include = ["*.ipynb"]
target-version = "py310"
# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "_build",
    "build",
    "dist",
    "venv",
    "__init__.py",
    "docs/conf.py",
]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "COM",
    "D417",
    "E",
    "ERA",
    "F",
    "I",
    "ICN",
    "NPY001",
    "PD002",
    "PIE",
    "PLE",
    "PLW",
    "PT",
    "UP",
    "Q",
    "PTH",
    "RSE",
    "RET",
    "RUF",
    "SIM",
    "W",
]
ignore = [
    "ANN202",  # return types of nested augmenter functions
    "ANN401",
    "E402",
    "E501",
    "F841",
    "RET504",
    "COM812",
]
# Allow autofix for all enabled rules (when `--fix`) is provided.
unfixable = ["ERA"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# keyboard layouts intentionally contain non-latin characters
"src/augmenty/lang/*/keyboard.py" = ["RUF001"]
# tutorials favour readability over annotations
"docs/**" = ["ANN", "ERA"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-none-returning = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["src", "tests"]

[tool.semantic_release]
# PSR builds *before* it creates the tag, so setuptools-scm cannot see the new
# version in the git history yet. PSR injects NEW_VERSION into the build
# environment; hand it to setuptools-scm so the artifacts are stamped correctly.
build_command = "python -m pip install build && SETUPTOOLS_SCM_PRETEND_VERSION_FOR_AUGMENTY=$NEW_VERSION python -m build"

[tool.semantic_release.branches.main]
match = "main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
augmenty = ["meta.json"]

[tool.setuptools_scm]
# `v1.4.4` -> `1.4.4`, matching the tags semantic-release creates.
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
# PyPI rejects local version segments (`+g1a2b3c4`), which the default scheme
# adds for any commit that is not exactly on a tag.
local_scheme = "no-local-version"
